on:
  workflow_call:
    secrets:
      HF_TOKEN:
        required: true
    inputs:
      model-name:
        required: true
        type: string
      model-source:
        required: true
        type: string
      runner:
        required: true
        type: string
      hf-name:
        required: false
        type: string
      upload:
        type: boolean
        default: false

jobs:
  export:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv run --group onnx immich-model export "$MODEL_NAME" "$MODEL_SOURCE" --hf-model-name "$HF_MODEL_NAME"
        env:
          MODEL_NAME: ${{ inputs.model-name }}
          MODEL_SOURCE: ${{ inputs.model-source }}
          HF_MODEL_NAME: ${{ inputs.hf-name || inputs.model-name }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # CLIP models publish at an opset RKNN can't ingest, so build the RKNN binaries from a lower-opset copy
      - run: |
          if [ "$MODEL_SOURCE" = insightface ]; then
            uv run --group rknn immich-model compile "$MODEL_NAME"
          else
            uv run --group onnx immich-model export "$MODEL_NAME" "$MODEL_SOURCE" \
              --hf-model-name "$HF_MODEL_NAME" --opset 20 --output-dir rknn-build
            uv run --group rknn immich-model compile "$MODEL_NAME" --input-dir rknn-build
          fi
        env:
          MODEL_NAME: ${{ inputs.model-name }}
          MODEL_SOURCE: ${{ inputs.model-source }}
          HF_MODEL_NAME: ${{ inputs.hf-name || inputs.model-name }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: 32
        with:
          name: ${{ inputs.model-name }}
          path: models/
          compression-level: 0

  # When doing benchmarking, that goes here
  # Download the exported artifact, and upload an artifact with the benchmark result to be used below

  upload:
    if: ${{ inputs.upload }}
    runs-on: ${{ inputs.runner }}
    needs: export
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.model-name }}
          merge-multiple: 'true' # We don't actually have multiple, but this also sets the subfolder naming behaviour
          path: models/

      - run: |
          uv run immich-model upload "$MODEL_NAME" \
            --hf-model-name "$HF_MODEL_NAME" --hf-organization immich-testing --revision v2
        env:
          MODEL_NAME: ${{ inputs.model-name }}
          HF_MODEL_NAME: ${{ inputs.hf-name || inputs.model-name }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
