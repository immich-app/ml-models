on:
  workflow_call:
    secrets:
      HF_TOKEN:
        required: true
    inputs:
      model-name:
        required: true
        type: string
      model-source:
        required: true
        type: string
      runner:
        required: true
        type: string
      hf-name:
        required: false
        type: string
      upload:
        type: boolean
        default: false

jobs:
  export:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv run --extra export immich-model onnx export "$MODEL_NAME" "$MODEL_SOURCE" --hf-model-name "$HF_MODEL_NAME"
        env:
          MODEL_NAME: ${{ inputs.model-name }}
          MODEL_SOURCE: ${{ inputs.model-source }}
          HF_MODEL_NAME: ${{ inputs.hf-name || inputs.model-name }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # RKNN binaries are built from the same fused ONNX every other backend uses: `compile` runs
      # prepare_for_rknn, which decomposes the opset-23 Attention/Gelu into the toolkit's
      # exSDPAttention/exGelu fusion patterns (order-sensitive, so we emit them explicitly rather
      # than letting a lower-opset export decompose them) and pins opset 19. OCR models are
      # ONNX-only in immich_ml (no RKNN path), so they skip compilation entirely.
      - run: |
          if [ "$MODEL_SOURCE" = paddle ]; then
            echo "Skipping RKNN compile for OCR model $MODEL_NAME"
          else
            uv run --extra rknn immich-model rknn compile "$MODEL_NAME"
          fi
        env:
          MODEL_NAME: ${{ inputs.model-name }}
          MODEL_SOURCE: ${{ inputs.model-source }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.model-name }}
          path: models/

  # When doing benchmarking, that goes here
  # Download the exported artifact, and upload an artifact with the benchmark result to be used below

  upload:
    if: ${{ inputs.upload }}
    runs-on: ${{ inputs.runner }}
    needs: export
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra export

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.model-name }}
          merge-multiple: 'true' # We don't actually have multiple, but this also sets the subfolder naming behaviour
          path: models/

      # Fused face exports go to the v2 revision branch (immich_ml pins revisions; old
      # releases keep reading main). New-format repos (OCR) publish straight to main.
      - run: |
          if [ "$MODEL_SOURCE" = insightface ]; then HF_BRANCH=v2; else HF_BRANCH=main; fi
          uv run --extra export immich-model upload "$MODEL_NAME" \
            --hf-model-name "$HF_MODEL_NAME" --hf-organization immich-testing --hf-branch "$HF_BRANCH"
        env:
          MODEL_NAME: ${{ inputs.model-name }}
          MODEL_SOURCE: ${{ inputs.model-source }}
          HF_MODEL_NAME: ${{ inputs.hf-name || inputs.model-name }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
