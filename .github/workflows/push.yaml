name: Model export
on:
  push:
    branches: ['main']
  pull_request:
    types: ['opened', 'synchronize', 'reopened']
  release:
    types: ['published']
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        required: false
        description: 'Force export all models'
      organization:
        type: choice
        options: ['immich-testing', 'immich-app']
        default: 'immich-testing'
        description: 'Hugging Face organization to publish to'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The plans need no model, so they gate every push instead of waiting on the export matrix
  plans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # the rendering it hands back is of this PR's own source and is committed to this PR's own head,
          # and a PR-scoped cache is readable by no other PR, so a poisoned one reaches nothing new
          enable-cache: true # zizmor: ignore[cache-poisoning]
          cache-dependency-glob: uv.lock
      - id: check
        run: uv run --frozen --extra export immich-model check plan
      - if: ${{ failure() && steps.check.outcome == 'failure' }}
        run: uv run --frozen --extra export immich-model check plan --bless
      - if: ${{ failure() && steps.check.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderings-plans
          path: ci/plans.txt

  configure:
    runs-on: ubuntu-latest
    outputs:
      to_export: ${{ steps.scope.outputs.to_export }}
      unchanged: ${{ steps.scope.outputs.unchanged }}
      previous-ref: ${{ steps.ref.outputs.previous-ref }}
    steps:
      - name: Checkout new ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine previous ref
        id: ref
        run: |
          ev="${{ github.event_name }}"
          if [[ "$ev" == "push" ]]; then
            ref="${{ github.event.before }}"
          elif [[ "$ev" == "pull_request" ]]; then
            ref="${{ github.event.pull_request.base.sha }}"
          elif [[ "$ev" == "workflow_dispatch" ]]; then
            # TODO: This will currently never diff
            # What ref to diff against on a dispatch?
            ref="${{ github.event.ref }}"
          elif [[ "$ev" == "release" ]]; then
            ref=$(git rev-list --tags --max-count=1 --skip=1 --no-walk)
          fi
          echo "previous-ref=$ref" >> $GITHUB_OUTPUT
      - name: Checkout previous ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: before
          ref: ${{ steps.ref.outputs.previous-ref }}
      - id: new-models
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.53.3
        with:
          cmd: yq eval '.models' -o=json -I=0 ./models.yaml
      - id: old-models
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.53.3
        with:
          cmd: yq eval '.models' -o=json -I=0 ./before/models.yaml
      - id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Editor checks warn on these being "undefined", but they get passed to the script regardless.
          force: ${{ inputs.force || inputs.organization == 'immich-app' }}
          oldModels: ${{ steps.old-models.outputs.result }}
          newModels: ${{ steps.new-models.outputs.result }}
          # rendering-only modules: hashing them would re-export the catalog for a change that cannot alter it
          oldHash: ${{ hashFiles('./before/immich_model/**', '!./before/immich_model/_check.py', '!./before/immich_model/_render.py', './before/.github/workflows/push.yaml', './before/.github/workflows/export.yaml') }}
          newHash: ${{ hashFiles('./immich_model/**', '!./immich_model/_check.py', '!./immich_model/_render.py', './.github/workflows/push.yaml', './.github/workflows/export.yaml') }}
          script: |
            const script = require('./.github/scripts/scope.js')
            script({core})


  export:
    if: ${{ needs.configure.outputs.to_export != '[]' }}
    uses: ./.github/workflows/export.yaml
    needs: configure
    secrets: inherit
    strategy:
      # Prevent a failure in one image from stopping the other builds
      # TODO: Is this what we want to do with failures?
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure.outputs.to_export) }}
    with:
      model-name: ${{ matrix.name }}
      model-source: ${{ matrix.source }}
      hf-name: ${{ matrix.hf-name }}
      runner: ${{ matrix.runner || 'ubuntu-latest'}}
      # use what the operator picked if dispatch, upload to immich-testing if push to main, else don't publish
      organization: ${{ github.event_name == 'workflow_dispatch' && inputs.organization
        || github.event_name == 'push' && 'immich-testing' || '' }}
      previous-ref: ${{ needs.configure.outputs.previous-ref }}
      compile-all: ${{ inputs.force || inputs.organization == 'immich-app' }}

  # Read at the end rather than off the event payload, so labelling while the matrix runs still counts.
  labelled:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [plans, export]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      wanted: ${{ steps.label.outputs.wanted }}
    steps:
      - id: label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            })
            const wanted = pull.labels.some((applied) => applied.name === 'fix:fixtures')
            core.info(wanted ? 'labelled fix:fixtures' : 'not labelled, leaving the fixtures alone')
            core.setOutput('wanted', wanted ? 'yes' : '')

  commit-fixtures:
    needs: labelled
    if: ${{ !cancelled() && needs.labelled.outputs.wanted }}
    uses: ./.github/workflows/commit-fixtures.yaml
    secrets:
      client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
      private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
    with:
      run-id: ${{ github.run_id }}
      branch: ${{ github.event.pull_request.head.ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      pull-number: ${{ github.event.pull_request.number }}

