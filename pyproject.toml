[project]
name = "immich_model"
version = "0.1.0"
description = "Export Immich's CLIP and face models to ONNX and compile them for on-device runtimes."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "huggingface-hub>=0.29.3",
  "typer>=0.15.2",
  "tenacity>=9.0.0",
  "polars>=1.25.2",
  "kaggle>=1.7.4.2",
]

[project.scripts]
immich-model = "immich_model:app"

[dependency-groups]
dev = ["black>=23.3.0", "mypy>=1.3.0", "ruff>=0.0.272"]

onnx = [
  "onnx>=1.18.0",
  "onnxruntime>=1.18.2",
  "onnxscript>=0.7.0",
  "ml-dtypes>=0.5.0",
  "open-clip-torch>=2.31.0",
  "multilingual-clip>=1.0.10",
  "transformers>=4.49.0",
  "clip-benchmark",
  "numpy>=2.1.0",
]

rknn = ["rknn-toolkit2>=2.3.0", "setuptools<81"]

[tool.uv]
# `onnx` and `rknn` have mutually incompatible pins (numpy/protobuf/onnx/torch)
conflicts = [[{ group = "onnx" }, { group = "rknn" }]]
override-dependencies = ["onnxoptimizer>=0.4.2"]

[tool.uv.sources]
clip-benchmark = { git = "https://github.com/mertalev/CLIP_benchmark.git", rev = "77e733ee241399611296d3c4aca583ec89cf5190" }

[tool.hatch.build.targets.sdist]
include = ["immich_model"]

[tool.hatch.build.targets.wheel]
include = ["immich_model"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
warn_redundant_casts = true
disallow_any_generics = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 120
target-version = ['py312']
